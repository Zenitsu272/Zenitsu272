name: Daily README update

on:
  schedule:
    # 04:30 UTC = 10:00 AM India time.
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-readme-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Zenitsu272/Zenitsu272'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update the daily README marker
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          from datetime import datetime
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          repo = os.environ["REPOSITORY"]
          branch = os.environ["DEFAULT_BRANCH"]
          endpoint = f"https://api.github.com/repos/{repo}/contents/README.md"
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "daily-readme-update",
          }

          def api(url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(url, data=data, headers=headers,
                                method="GET" if payload is None else "PUT")
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          current = api(endpoint + "?ref=" + quote(branch, safe=""))
          content = base64.b64decode(current["content"]).decode("utf-8")
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          marker = f"<!-- automated-daily-update: {today} -->"
          pattern = r"<!-- automated-daily-update: \d{4}-\d{2}-\d{2} -->"
          matches = re.findall(pattern, content)
          if len(matches) > 1:
              raise RuntimeError("Multiple daily markers found; refusing to alter README.")
          if marker in content:
              print(f"Already updated for {today}; no commit needed.")
              raise SystemExit(0)
          if matches:
              updated = re.sub(pattern, marker, content, count=1)
          else:
              updated = content + ("" if content.endswith("\n") else "\n") + marker + "\n"
          result = api(endpoint, {
              "message": f"chore: automated daily README update ({today})",
              "content": base64.b64encode(updated.encode("utf-8")).decode(),
              "sha": current["sha"],
              "branch": branch,
              "author": {"name": "Zenitsu272", "email": "vaishak.2327@gmail.com"},
          })
          verified = api(endpoint + "?ref=" + result["commit"]["sha"])
          assert base64.b64decode(verified["content"]).decode("utf-8") == updated
          print("Committed and verified: " + result["commit"]["html_url"])
          PY
